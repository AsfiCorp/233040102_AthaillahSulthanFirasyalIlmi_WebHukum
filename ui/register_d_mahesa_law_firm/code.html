<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Autofill styles for dark theme */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px #1C2541 inset !important;
            -webkit-text-fill-color: #e1e3e4 !important;
            transition: background-color 5000s ease-in-out 0s;
        }
    </style>

<body class="bg-background text-on-background min-h-screen flex items-center justify-center font-body-md overflow-hidden relative">
<!-- Atmospheric Background -->
<div class="absolute inset-0 pointer-events-none opacity-20">
<div class="absolute top-[-20%] left-[-10%] w-[50vw] h-[50vw] rounded-full bg-primary-container blur-[120px]"></div>
<div class="absolute bottom-[-20%] right-[-10%] w-[40vw] h-[40vw] rounded-full bg-secondary-container opacity-30 blur-[100px]"></div>
</div>
<!-- Main Registration Container -->
<div class="w-full max-w-[480px] p-margin-mobile md:p-0 z-10">
<!-- Card Surface -->
<div class="bg-[#1C2541] border border-outline-variant/30 rounded-DEFAULT shadow-[0_30px_60px_-15px_rgba(5,8,18,0.5)] p-8 md:p-12 relative overflow-hidden">
<!-- Subtle Gold Accent Line -->
<div class="absolute top-0 left-0 right-0 h-[2px] bg-secondary opacity-80"></div>
<!-- Header Section -->
<div class="text-center mb-10">
<h1 class="font-headline-md text-headline-md text-secondary mb-2 uppercase tracking-widest">D'Mahesa Law Firm</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Create Your Account</p>
</div>
<!-- Registration Form -->
<form action="#" class="space-y-6" method="POST">
<!-- Full Name Field -->
<div class="relative group">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-1 group-focus-within:text-secondary transition-colors" for="fullName">Full Name</label>
<input class="w-full bg-transparent border-0 border-b border-outline-variant/50 text-on-surface font-body-md text-body-md px-0 py-2 focus:ring-0 focus:border-secondary transition-colors placeholder:text-outline-variant/50" id="fullName" name="fullName" placeholder="John Doe" required="" type="text"/>
</div>
<!-- Email Field -->
<div class="relative group">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-1 group-focus-within:text-secondary transition-colors" for="email">Email Address</label>
<input class="w-full bg-transparent border-0 border-b border-outline-variant/50 text-on-surface font-body-md text-body-md px-0 py-2 focus:ring-0 focus:border-secondary transition-colors placeholder:text-outline-variant/50" id="email" name="email" placeholder="john.doe@example.com" required="" type="email"/>
</div>
<!-- Password Field -->
<div class="relative group">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-1 group-focus-within:text-secondary transition-colors" for="password">Password</label>
<input class="w-full bg-transparent border-0 border-b border-outline-variant/50 text-on-surface font-body-md text-body-md px-0 py-2 focus:ring-0 focus:border-secondary transition-colors placeholder:text-outline-variant/50" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-0 bottom-2 text-on-surface-variant hover:text-secondary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
<!-- Confirm Password Field -->
<div class="relative group">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-1 group-focus-within:text-secondary transition-colors" for="confirmPassword">Confirm Password</label>
<input class="w-full bg-transparent border-0 border-b border-outline-variant/50 text-on-surface font-body-md text-body-md px-0 py-2 focus:ring-0 focus:border-secondary transition-colors placeholder:text-outline-variant/50" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required="" type="password"/>
</div>
<!-- Primary Action -->
<div class="pt-4">
<button class="w-full bg-secondary text-on-secondary font-label-caps text-label-caps py-4 uppercase tracking-widest hover:bg-secondary-fixed-dim transition-colors duration-300 focus:outline-none focus:ring-2 focus:ring-secondary focus:ring-offset-2 focus:ring-offset-background" type="submit">
                        Create Account
                    </button>
</div>
</form>
<!-- Divider -->
<div class="relative my-8">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/30"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-4 bg-[#1C2541] font-label-caps text-label-caps text-on-surface-variant">OR</span>
</div>
</div>
<!-- Secondary Action (Google Sign up) -->
<a class="w-full flex items-center justify-center gap-3 bg-inverse-surface text-on-surface font-label-caps text-label-caps py-3 uppercase tracking-widest hover:bg-surface-variant hover:text-inverse-surface transition-colors duration-300 border border-transparent focus:outline-none focus:ring-2 focus:ring-secondary focus:ring-offset-2 focus:ring-offset-background group" href="/auth/google">
<!-- Simple SVG Placeholder for Google Logo -->
<svg class="w-5 h-5 text-on-surface group-hover:text-inverse-surface transition-colors" fill="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                Sign up with Google
            </a>
<!-- Footer Link -->
<div class="mt-8 text-center font-body-md text-body-md text-on-surface-variant">
                Already have an account? <a class="text-secondary hover:underline underline-offset-4 transition-all" href="/login.html">Sign in</a>
</div>
</div>
</div>
<!-- Script for simple interactions (e.g. password visibility toggle) -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const togglePasswordBtns = document.querySelectorAll('[aria-label="Toggle password visibility"]');
            
            togglePasswordBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    const input = this.previousElementSibling;
                    const icon = this.querySelector('span');
                    
                    if (input.type === 'password') {
                        input.type = 'text';
                        icon.textContent = 'visibility_off';
                        icon.setAttribute('data-icon', 'visibility_off');
                    } else {
                        input.type = 'password';
                        icon.textContent = 'visibility';
                        icon.setAttribute('data-icon', 'visibility');
                    }
                });
            });
        });
    </script>
</body></html>
